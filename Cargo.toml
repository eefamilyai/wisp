[workspace]
resolver = "2"
members = [
    "crates/wisp-core",
    "crates/wisp-agent",
    "crates/wisp-config",
    "crates/wisp-setup",
    "crates/wisp-uninstall",
    "crates/wisp-version",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# needle/whisper math is unusably slow unoptimised, even in dev builds
[profile.dev.package."*"]
opt-level = 3
